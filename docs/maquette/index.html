<style>
/* Concept : un seul produit, trois espaces. Site public éditorial et lisible au soleil, espace participant épuré, back-office dense. Le vert porte l'identité, l'orange ne sert qu'aux appels ponctuels. */
:root{
  --green:#039846;--green-d:#026b30;--green-pale:#DDF4E5;
  --orange:#E56001;--orange-d:#A24400;--orange-pale:#FFF0E2;

  --red:#B42318;--red-pale:#FDE9E7;--gold:#9A7416;--gold-pale:#FBF3D9;
  --head:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:10px;color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--ink);font:15px/1.55 var(--body);padding-block:0}

h1,h2,h3,h4{font-family:var(--head);margin:0;line-height:1.2;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(2rem,5vw,3.25rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.4rem,3vw,1.9rem);font-weight:700;letter-spacing:-.01em}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mute{color:var(--mute)}.sm{font-size:.86rem}.xs{font-size:.78rem}.num{font-variant-numeric:tabular-nums}
.eyebrow{font:600 .74rem/1 var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--green-d)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}

.min0{min-width:0}
svg.i{flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:var(--r);border:1.5px solid transparent;font:600 .92rem var(--body);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn.sm{height:34px;padding:0 12px;font-size:.84rem}
.btn-p{background:var(--green);color:#fff}.btn-p:hover{background:var(--green-d)}
.btn-o{background:#fff;color:var(--green-d);border-color:var(--green)}.btn-o:hover{background:var(--green-pale)}
.btn-a{background:var(--orange);color:#fff}.btn-a:hover{background:#c85500}
.btn-g{background:var(--soft);color:var(--ink)}.btn-g:hover{background:#e7e9ec}
.btn-r{background:#fff;color:var(--red);border-color:#e7b4af}.btn-r:hover{background:var(--red-pale)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid #8bd3a8;outline-offset:2px}
.lnk{color:var(--green-d);font-weight:600;text-decoration:none}.lnk:hover{text-decoration:underline}

/* badges */
.bd{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font:600 .74rem var(--body);white-space:nowrap;background:var(--soft);color:var(--ink)}
.bd.ok{background:var(--green-pale);color:var(--green-d)}
.bd.no{background:var(--red-pale);color:var(--red)}
.bd.wait{background:var(--orange-pale);color:var(--orange-d)}
.bd.gold{background:var(--gold-pale);color:var(--gold)}
.bd.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}

@media (prefers-reduced-motion:reduce){.bd.live::before{animation:none}*{scroll-behavior:auto!important}}

/* cartes et tableaux */

.ico.o{background:var(--orange-pale);color:var(--orange-d)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:.9rem}

.logo{display:block;height:46px;width:auto}
.nav{display:flex;gap:4px;align-items:center}
.nav a{padding:8px 11px;border-radius:8px;text-decoration:none;font-weight:500;font-size:.92rem;color:var(--ink);position:relative}

.nav a.on{color:var(--green-d);font-weight:600}
.nav a.on::after{content:"";position:absolute;left:11px;right:11px;bottom:-12px;height:3px;background:var(--green);border-radius:3px}
.burger{display:none}
.demo{background:var(--ink);color:#fff;font-size:.8rem}
.demo .wrap{display:flex;gap:10px;align-items:center;min-height:34px;flex-wrap:wrap;padding-block:6px}
.demo a{color:#fff;font-weight:600}
@media(max-width:980px){

  .nav.open{display:flex}.nav a.on::after{display:none}.nav a.on{background:var(--green-pale)}

}
section.s{padding-block:64px}section.s.alt{background:var(--soft)}
.sh{display:flex;align-items:flex-end;gap:16px;margin-bottom:28px;flex-wrap:wrap}

.lb{display:grid;grid-template-columns:28px 1fr 46px;gap:10px;align-items:center;padding:10px 18px}
.lb+.lb{border-top:1px solid var(--line)}
.lb .rk{font:700 .9rem var(--head);color:var(--mute);text-align:center}
.bar{height:6px;border-radius:6px;background:var(--soft);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
.fig{font:800 2.4rem/1 var(--head);color:var(--green-d);font-variant-numeric:tabular-nums}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;counter-reset:t}
.tl>div{position:relative;padding:34px 14px 0 0}

.news{display:flex;flex-direction:column;overflow:hidden;padding:0}
.news .ph{height:120px;background:var(--green-pale);display:grid;place-items:center;color:var(--green-d)}
.news.o .ph{background:var(--orange-pale);color:var(--orange-d)}.news.g .ph{background:var(--soft);color:var(--ink)}
.news .bd{margin-bottom:8px}
.news .b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.cta{background:var(--ink);color:#fff;border-radius:16px;padding:36px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
.cta h2{color:#fff}.cta p{color:#cbd2da;margin-top:6px}
.foot{background:var(--ink);color:#cbd2da;padding-block:48px 28px;font-size:.9rem}
.foot a{color:#cbd2da;text-decoration:none;display:block;padding:3px 0}.foot a:hover{color:#fff}
.foot h4{color:#fff;font-size:.9rem;margin-bottom:8px}
.foot .lg{background:#fff;border-radius:10px;padding:6px 10px;display:inline-block}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:12px 14px;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--green-d);border-color:var(--green)}
.pg{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:12px 0;flex-wrap:wrap}
.pg button{min-width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-weight:600}
.pg button.on{background:var(--green);border-color:var(--green);color:#fff}.pg button[disabled]{opacity:.4;cursor:default}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}
.champ{border:1px solid #e6d9a8;background:linear-gradient(#fff,var(--gold-pale));border-radius:14px;padding:22px}
.crumb{font-size:.84rem;color:var(--mute);margin-bottom:14px}
.stepper{display:flex;gap:8px;margin-bottom:20px}.stepper i{flex:1;height:5px;border-radius:5px;background:var(--line)}.stepper i.on{background:var(--green)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 16px}.kv dt{color:var(--mute);font-size:.86rem}.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
@media(max-width:520px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}

/* espaces connectés */
.sp-top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
.sp-top .wrap{display:flex;align-items:center;gap:16px;min-height:64px}
.sp-nav{display:flex;gap:2px;flex-wrap:wrap}
.sp-nav a{display:flex;gap:8px;align-items:center;padding:9px 12px;border-radius:8px;text-decoration:none;font-weight:500;font-size:.9rem}
.sp-nav a:hover{background:var(--soft)}.sp-nav a.on{background:var(--green-pale);color:var(--green-d);font-weight:600}
.status-card{border-radius:14px;padding:24px;background:var(--green-pale);display:flex;gap:18px;align-items:center;flex-wrap:wrap}

.tline{list-style:none;margin:0;padding:0}
.tline li{position:relative;padding:0 0 18px 28px;border-left:2px solid var(--line);margin-left:7px}
.tline li:last-child{padding-bottom:0;border-color:transparent}
.tline li::before{content:"";position:absolute;left:-8px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--green)}
.tline li.no::before{border-color:var(--red)}.tline li.wait::before{border-color:var(--orange)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--orange);display:inline-block}
.ro{background:var(--soft);border-radius:var(--r);padding:10px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between}

/* admin */
.adm{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;background:#f8f9fa}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px 12px calc(12px + env(safe-area-inset-left,0px));overflow-y:auto;z-index:45}

}

const JURY = [

/* Génère n scores uniques décroissants, répartis au hasard sur les ids */
function genScores(ids, r, top = 92) {
  const vals = []; let v = top;
  for (let k = 0; k < ids.length; k++) { vals.push(v); v -= 2 + Math.floor(r() * 4); }
  const order = ids.slice().sort(() => r() - .5);
  const sc = {}; order.forEach((id, k) => { sc[id] = vals[k]; });
  return sc;
}
function pinRank(sc, pid, rank) {
  if (sc[pid] == null) return;
  const sorted = Object.keys(sc).sort((a, b) => sc[b] - sc[a]);
  const other = sorted[rank - 1]; if (!other || other === pid) return;
  const t = sc[pid]; sc[pid] = sc[other]; sc[other] = t;
}

const pOf = (id) => D.participants.find(p => p.id === id);
const edOf = (id) => D.editions.find(e => e.id === id);

/* Classement par points : le rang découle du score, l'issue découle du rang */
function ranking(s) {
  const ph = phaseOf(s);
  const rows = s.parts.filter(id => s.sc[id] != null && s.sc[id] !== '').map(id => ({ pid: id, score: +s.sc[id], ov: s.ov && s.ov[id] ? +s.ov[id] : null }));
  rows.sort((a, b) => b.score - a.score || (a.ov ?? 99) - (b.ov ?? 99));
  rows.forEach((r, i) => { r.rank = i + 1; r.tie = false; r.same = rows.some(x => x !== r && x.score === r.score); });
  for (let i = 1; i < rows.length; i++) {
    const a = rows[i - 1], b = rows[i];
    if (a.score === b.score && (a.ov == null || b.ov == null || a.ov === b.ov)) {
      a.tie = b.tie = true;
      if ((i === ph.q || (ph.b > 0 && i === ph.q + ph.b))) { a.blocking = b.blocking = true; }
    }
  }
  rows.forEach(r => {
    r.issue = r.rank <= ph.q ? 'qualifie' : (r.rank <= ph.q + ph.b ? 'barrage' : 'elimine');
    if (ph.type === 'finale') r.issue = r.rank === 1 ? 'champion' : 'finaliste';
  });
  return rows;
}
const sessionState = (s) => {
  const missing = s.parts.filter(id => s.sc[id] == null || s.sc[id] === '');
  const rows = ranking(s);
  return { missing, rows, blocking: rows.some(r => r.blocking), ok: s.parts.length > 0 && !missing.length && !rows.some(r => r.blocking) };
};

function applyValidation(s) {
  const rows = ranking(s); const ph = phaseOf(s);
  rows.forEach(r => { const p = pOf(r.pid); if (r.issue === 'elimine') { p.st = 'elimine'; p.elimPh = ph.nom; } else if (r.issue === 'champion') { p.st = 'champion'; p.elimPh = null; } else if (r.issue === 'finaliste') { p.st = 'finaliste'; p.elimPh = ph.nom; } else { p.st = 'en_competition'; p.elimPh = null; } });
  s.st = 'valide';
}

/* Simulation d'une édition. stopAt : indice de phase en direct (null = édition complète) */
function simulate(ed, seed, opts = {}) {
  const r = mkr(seed); const phases = D.phases.filter(p => p.ed === ed).sort((a, b) => a.ordre - b.ordre);
  const parts = D.participants.filter(p => p.ed === ed).map(p => p.id);
  let alive = parts.slice(), pend = [], k = 0;
  const date = (i) => { if (opts.dates && opts.dates[i]) return opts.dates[i]; const d = new Date(opts.start + 'T12:00:00'); d.setDate(d.getDate() + i * 7); return d.toISOString().slice(0, 10); };
  for (let pi = 0; pi < phases.length; pi++) {
    const ph = phases[pi]; const live = opts.liveAt != null && pi >= opts.liveAt;
    if (opts.liveAt != null && pi > opts.liveAt) break;
    let groups;
    if (ph.type === 'barrage') groups = [pend.slice()];
    else { groups = []; const per = Math.ceil(alive.length / ph.nbG); for (let g = 0; g < ph.nbG; g++) groups.push(alive.slice(g * per, (g + 1) * per)); }
    const nextAlive = [], nextPend = [];
    groups.forEach((ids, g) => {
      k++;
      const s = { id: `${ed}-s${k}`, ed, ph: ph.id, lab: ph.nbG > 1 ? `${ph.nom}, groupe ${'AB'[g]}` : ph.nom, date: date(k - 1) + ' 15:00', lieu: g % 2 ? 'Salle 2, Highfive University' : 'Amphi A, Highfive University', st: 'valide', parts: ids, sc: {}, ov: {}, com: {}, jury: ['j1', 'j2', 'j3'].slice(0, 3), hist: [], max: ph.max };
      if (live && g > 0) { s.st = 'planifie'; D.seances.push(s); return; }
      s.sc = genScores(ids, r, ph.max === 100 ? 94 : ph.max);
      if (opts.fav && opts.fav.ranks[pi + 1]) pinRank(s.sc, opts.fav.pid, opts.fav.ranks[pi + 1]);
      if (live) {
        s.st = 'en_cours';
        const sorted = ids.slice().sort((a, b) => s.sc[b] - s.sc[a]);
        if (sorted.length > ph.q) s.sc[sorted[ph.q]] = s.sc[sorted[ph.q - 1]];
        s.hist.push({ at: date(k - 1) + ' 14:10', who: 'Admin Démo', txt: 'Séance ouverte, saisie des scores en direct' });
        D.seances.push(s); return;
      }
      s.hist.push({ at: s.date.slice(0, 10) + ' 18:40', who: 'Admin Démo', txt: 'Scores saisis et séance validée' });
      const rows = ranking(s);
      rows.forEach(rw => { if (rw.issue === 'qualifie' || rw.issue === 'champion' || rw.issue === 'finaliste') nextAlive.push(rw.pid); if (rw.issue === 'barrage') nextPend.push(rw.pid); });
      applyValidation(s); D.seances.push(s);
    });
    if (live) { // les qualifiés de la phase précédente restent disponibles
      break;
    }
    if (ph.type === 'barrage') { alive = alive.concat(nextAlive); pend = []; }
    else { alive = nextAlive; pend = pend.concat(nextPend); }
    if (ph.type === 'finale') alive = nextAlive;
  }
}

const logo = (h = 46) => `<img class="logo" style="height:${h}px" src="${LOGO}" alt="DevAs, Question pour un DevAs">`;

const AVC = [['var(--green-pale)', 'var(--green-d)'], ['var(--orange-pale)', 'var(--orange-d)'], ['var(--soft)', 'var(--ink)']];
const av = (p, cls = '') => { const i = (p.prenom.charCodeAt(0) + p.nom.charCodeAt(0)) % 3; return `<span class="av ${cls}" style="background:${AVC[i][0]};color:${AVC[i][1]}" aria-hidden="true">${esc(p.prenom[0] + p.nom[0])}</span>`; };
const nm = (p) => `${p.prenom} ${p.nom}`;
const who = (p, sub) => `<div class="who">${av(p)}<div class="min0"><b>${esc(nm(p))}</b>${sub ? `<span class="mute xs">${esc(sub)}</span>` : ''}</div></div>`;
const bd = (label, kind = '') => `<span class="bd ${kind}">${esc(label)}</span>`;
const issueBd = (i) => i ? bd(ISSUE[i][0], ISSUE[i][1]) : bd('Non publiée', '');
const EDST = { candidatures_ouvertes: ['Candidatures ouvertes', 'wait'], en_cours: ['En cours', 'ok'], terminee: ['Terminée', ''], archivee: ['Archivée', ''], preparation: ['Préparation', 'wait'] };
const edBd = (e) => bd(EDST[e.statut][0], EDST[e.statut][1]);
const PST = { en_competition: ['En compétition', 'ok'], elimine: ['Éliminé', 'no'], champion: ['Champion', 'gold'], finaliste: ['Finaliste', 'ok'], en_attente: ['En attente', 'wait'] };
const pBd = (p) => bd(PST[p.st][0], PST[p.st][1]);
const SESST = { planifie: ['Planifiée', 'wait'], en_cours: ['En direct', 'ok live'], valide: ['Validée', 'ok'], termine: ['Terminée', ''] };
const sBd = (s) => bd(SESST[s.st][0], SESST[s.st][1]);

const field = (name, label, o = {}) => {
  const v = o.vals ? (o.vals[name] ?? '') : (S.form[name] ?? ''); const er = (o.errs || S.errs)[name];
  const common = `id="f-${name}" name="${name}" class="inp" ${o.form !== false && !o.vals ? `data-form="${name}"` : ''} ${o.req ? 'required' : ''} ${er ? 'aria-invalid="true"' : ''}`;
  let input;
  if (o.type === 'select') input = `<select ${common}>${o.opts.map(x => { const [val, lab] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(val)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select>`;
  else if (o.type === 'textarea') input = `<textarea ${common} rows="${o.rows || 3}">${esc(v)}</textarea>`;
  else input = `<input ${common} type="${o.type || 'text'}" value="${esc(v)}" ${o.ph ? `placeholder="${esc(o.ph)}"` : ''} ${o.min != null ? `min="${o.min}"` : ''} ${o.max != null ? `max="${o.max}"` : ''}>`;
  return `<div class="fld ${er ? 'bad' : ''}"><label for="f-${name}">${esc(label)}${o.req ? ' <span class="mute">*</span>' : ''}</label>${input}${er ? `<span class="err" role="alert">${esc(er)}</span>` : o.hint ? `<span class="hint">${esc(o.hint)}</span>` : ''}</div>`;
};

function toast(msg, kind = 'ok') {
  const box = document.getElementById('toasts'); if (!box) return;
  const t = document.createElement('div'); t.className = `toast ${kind}`; t.setAttribute('role', 'status');
  t.innerHTML = `${ic(kind === 'err' ? 'alert' : 'check', 18)}<span>${esc(msg)}</span>`;
  box.appendChild(t); setTimeout(() => t.remove(), 3800);
}
const logAct = (act, el) => { const n = new Date(); D.log.unshift({ at: `${TODAY} ${pad(n.getHours())}:${pad(n.getMinutes())}`, who: 'Admin Démo', act, el }); };

function pager(key, total, per) {
  const pages = Math.max(1, Math.ceil(total / per)); const cur = Math.min(S.f[key + '.p'] || 1, pages);
  if (pages <= 1) return { cur, html: '', from: 0, to: total };
  let b = `<button data-act="page" data-key="${key}" data-arg="${cur - 1}" ${cur === 1 ? 'disabled' : ''} aria-label="Page précédente">‹</button>`;
  for (let i = 1; i <= pages; i++) b += `<button data-act="page" data-key="${key}" data-arg="${i}" class="${i === cur ? 'on' : ''}" ${i === cur ? 'aria-current="page"' : ''}>${i}</button>`;
  b += `<button data-act="page" data-key="${key}" data-arg="${cur + 1}" ${cur === pages ? 'disabled' : ''} aria-label="Page suivante">›</button>`;
  return { cur, html: `<div class="pg"><span class="mute sm">${(cur - 1) * per + 1} à ${Math.min(cur * per, total)} sur ${total}</span>${b}</div>`, from: (cur - 1) * per, to: cur * per };
}

/* Graphique en barres, dessiné à l'échelle */
function bars(vals, labels, o = {}) {
  const W = 560, H = o.h || 190, L = 34, B = 26, T = 12, max = o.max || Math.max(...vals, 1), n = vals.length, bw = Math.min(46, (W - L - 8) / n - 10);
  const y = v => T + (H - T - B) * (1 - v / max); const ticks = [0, .5, 1].map(t => Math.round(max * t));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label || 'Graphique')}" style="max-width:100%;display:block">`;
  ticks.forEach(t => { s += `<line x1="${L}" x2="${W - 4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--mute)">${t}</text>`; });
  vals.forEach((v, i) => { const x = L + 8 + i * ((W - L - 8) / n) + ((W - L - 8) / n - bw) / 2; s += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${H - B - y(v)}" rx="4" fill="${o.hl === i ? 'var(--orange)' : 'var(--green)'}"/><text x="${x + bw / 2}" y="${y(v) - 5}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${v}</text><text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--mute)">${esc(labels[i])}</text>`; });
  return s + '</svg>';
}

  if (tab === 'participants') body = `<div class="grid c3">${ps.filter(p => p.pub).map(p => `<a class="card" href="#profil-${p.id}" style="text-decoration:none;padding:14px 16px">${who(p, p.etab)}<div style="margin-top:10px">${pBd(p)}</div></a>`).join('') || empty('users', 'Participants non publiés', 'La liste sera publiée par l\'organisation.')}</div>`;
  if (tab === 'classement') {
    const fr = finalRank(id);
    if (fr) body = `<div class="podium">${fr.map(r => { const p = pOf(r.pid); return `<div class="${r.rank === 1 ? 'champ' : 'card'}"><div class="row" style="flex-wrap:nowrap">${av(p, 'm')}<div class="min0"><span class="bd ${r.rank === 1 ? 'gold' : ''}">${r.rank === 1 ? 'DevAs' : r.rank + (r.rank === 2 ? 'e, finaliste' : 'e place')}</span><div style="margin-top:6px"><a class="lnk" href="#profil-${p.id}">${esc(nm(p))}</a></div><span class="mute xs">${r.score} points</span></div></div></div>`; }).join('')}</div><p class="mute sm" style="margin-top:12px">La finale désigne les rangs 1 et 2. Les 3e et 4e places viennent du classement de la demi-finale.</p>`;
    else { const last = pubSess[pubSess.length - 1]; body = `<div class="warn">${ic('info')}<span>Le classement final officiel sera publié à l'issue de la finale. Dernier classement validé ci-dessous.</span></div>${last ? `<h3 style="margin:20px 0 10px">${esc(last.lab)}</h3>${rankTable(last)}` : ''}`; }
  }

  <div class="fld"><label for="f-com">Commentaire interne</label><textarea class="inp" id="f-com" name="com" rows="3">${esc(vals.com ?? c.com)}</textarea><span class="hint">Visible des administrateurs uniquement.</span></div>
  ${done ? `<div class="okbox">${ic('check')}<span>Fiche participant créée (n° ${done.num}). Le compte reste à activer dans Participants.</span></div>` : ''}
  <div class="row"><button type="button" class="btn btn-p sm" data-act="cand-act" data-arg="accept" data-id="${c.id}" ${c.st === 'acceptee' ? 'disabled' : ''}>${ic('check', 15)}Accepter</button><button type="button" class="btn btn-r sm" data-act="cand-act" data-arg="refuse" data-id="${c.id}" ${c.st === 'refusee' ? 'disabled' : ''}>Refuser</button><button type="button" class="btn btn-g sm" data-act="cand-act" data-arg="wait" data-id="${c.id}" ${c.st === 'en_attente' ? 'disabled' : ''}>Mettre en attente</button></div>`;
}

/* ---- Participants ---- */
function aParts() {
  const q = (S.f['ap.q'] || '').toLowerCase(), ed = S.f['ap.ed'] || CED, st = S.f['ap.st'] || 'tous';
  let l = partsOf(ed).filter(p => (st === 'tous' || p.st === st) && (nm(p) + p.etab).toLowerCase().includes(q));
  const pg = pager('ap', l.length, 10); l = l.slice(pg.from, pg.to || undefined);
  return `<div class="stack" style="gap:20px">${head('Participants', 'Un participant éliminé ne peut plus être sélectionné dans une séance de la même édition, sauf correction officielle.', `<button class="btn btn-p" data-act="pt-add">${ic('plus', 16)}Ajouter un participant</button>`)}
  <div class="tool">${search('ap.q', 'Rechercher un nom ou un établissement')}${sel('ap.ed', 'Édition', D.editions.map(e => [e.id, 'Édition ' + e.annee]))}${sel('ap.st', 'Statut', [['tous', 'Tous les statuts'], ['en_competition', 'En compétition'], ['elimine', 'Éliminé'], ['finaliste', 'Finaliste'], ['champion', 'Champion'], ['en_attente', 'En attente']])}</div>
  ${l.length ? `<div class="tw"><table><thead><tr><th>N°</th><th>Participant</th><th>Établissement</th><th>Classe</th><th>Statut</th><th>Compte</th><th></th></tr></thead><tbody>${l.map(p => `<tr><td class="num">${p.num}</td><td>${who(p, p.email)}</td><td>${esc(p.etab)}</td><td>${esc(p.classe)}</td><td>${pBd(p)}${p.elimPh ? `<div class="mute xs" style="margin-top:3px">${esc(p.elimPh)}</div>` : ''}</td><td><button class="btn sm ${p.compte ? 'btn-o' : 'btn-g'}" data-act="pt-acct" data-arg="${p.id}">${p.compte ? 'Actif' : 'Inactif'}</button></td><td class="r"><div class="row" style="justify-content:flex-end;flex-wrap:nowrap"><button class="btn btn-g sm" data-act="pt-view" data-arg="${p.id}">Profil</button><button class="btn btn-g sm" data-act="pt-edit" data-arg="${p.id}" aria-label="Modifier">${ic('edit', 15)}</button></div></td></tr>`).join('')}</tbody></table></div>${pg.html}` : empty('users', 'Aucun participant', 'Aucun résultat pour ces filtres.')}</div>`;
}
const ptForm = (vals, errs) => { const f = FF(vals, errs); return `<div class="fg">${f('prenom', 'Prénom', { req: 1 })}${f('nom', 'Nom', { req: 1 })}</div><div class="fg">${f('etab', 'Établissement', { req: 1 })}${f('classe', 'Classe ou niveau')}</div><div class="fg">${f('email', 'E-mail', { type: 'email', req: 1 })}${f('tel', 'Téléphone')}</div>`; };

/* ---- Phases ---- */
function aPhases() {
  const ed = S.f['aph.ed'] || CED; const l = phasesOf(ed);
  return `<div class="stack" style="gap:20px">${head('Phases', 'Aucun nombre de phases imposé : créez, réordonnez et ajustez librement.', `<button class="btn btn-p" data-act="ph-add">${ic('plus', 16)}Créer une phase</button>`)}
  <div class="tool">${sel('aph.ed', 'Édition', D.editions.map(e => [e.id, 'Édition ' + e.annee]))}</div>
  ${l.length ? `<div class="tw"><table><thead><tr><th>Ordre</th><th>Phase</th><th>Type</th><th class="r">Groupes</th><th class="r">Qualifiés par groupe</th><th class="r">Au barrage</th><th class="r">Séances</th><th></th></tr></thead><tbody>${l.map((p, i) => { const n = D.seances.filter(s => s.ph === p.id).length; return `<tr><td class="num"><div class="row" style="gap:4px;flex-wrap:nowrap"><b>${p.ordre}</b><button class="btn btn-g sm" style="padding:0 6px" data-act="ph-up" data-arg="${p.id}" ${i === 0 ? 'disabled' : ''} aria-label="Monter">${ic('up', 14)}</button><button class="btn btn-g sm" style="padding:0 6px" data-act="ph-down" data-arg="${p.id}" ${i === l.length - 1 ? 'disabled' : ''} aria-label="Descendre">${ic('down', 14)}</button></div></td><td><b>${esc(p.nom)}</b></td><td>${esc(p.type.replace('_', '-'))}</td><td class="r num">${p.nbG}</td><td class="r num">${p.q}</td><td class="r num">${p.b || '-'}</td><td class="r num">${n}</td><td class="r"><div class="row" style="justify-content:flex-end;flex-wrap:nowrap"><button class="btn btn-g sm" data-act="ph-edit" data-arg="${p.id}" aria-label="Modifier">${ic('edit', 15)}</button><button class="btn btn-r sm" data-act="ph-del" data-arg="${p.id}" ${n ? 'disabled title="Phase utilisée"' : ''} aria-label="Supprimer">${ic('trash', 15)}</button></div></td></tr>`; }).join('')}</tbody></table></div>` : empty('layers', 'Aucune phase', 'Créez la première phase de cette édition.')}</div>`;
}
const phForm = (vals, errs) => { const f = FF(vals, errs); return `<div class="fg">${f('nom', 'Nom de la phase', { req: 1 })}${f('type', 'Type', { type: 'select', opts: [['qualification', 'Qualification'], ['barrage', 'Barrage'], ['tour', 'Tour'], ['demi_finale', 'Demi-finale'], ['finale', 'Finale']] })}</div><div class="fg">${f('nbG', 'Nombre de groupes', { type: 'number', min: 1 })}${f('q', 'Qualifiés par groupe', { type: 'number', min: 1, hint: 'Le nombre de finalistes se règle ici pour la demi-finale.' })}</div>${f('b', 'Envoyés au barrage par groupe', { type: 'number', min: 0 })}`; };

/* ---- Séances ---- */
function aSeances() {
  const ed = S.f['as.ed'] || CED, st = S.f['as.st'] || 'tous';
  const l = sessOf(ed).filter(s => st === 'tous' || s.st === st);
  return `<div class="stack" style="gap:20px">${head('Séances', 'Chaque séance a ses participants, son jury, ses scores et sa validation officielle.', `<button class="btn btn-p" data-act="se-add">${ic('plus', 16)}Créer une séance</button>`)}
  <div class="tool">${sel('as.ed', 'Édition', D.editions.map(e => [e.id, 'Édition ' + e.annee]))}${sel('as.st', 'Statut', [['tous', 'Tous les statuts'], ['planifie', 'Planifiée'], ['en_cours', 'En direct'], ['valide', 'Validée']])}</div>
  ${l.length ? `<div class="tw"><table><thead><tr><th>Séance</th><th>Phase</th><th>Date</th><th>Lieu</th><th class="r">Participants</th><th class="r">Jury</th><th>Statut</th><th></th></tr></thead><tbody>${l.map(s => `<tr><td><b>${esc(s.lab)}</b></td><td>${esc(phaseOf(s).nom)}</td><td style="white-space:nowrap">${ds(s.date)} ${hm(s.date)}</td><td>${esc(s.lieu)}</td><td class="r num">${s.parts.length}</td><td class="r num">${s.jury.length}</td><td>${sBd(s)}</td><td class="r"><a class="btn btn-g sm" href="#admin-seance-${s.id}">Ouvrir</a></td></tr>`).join('')}</tbody></table></div>` : empty('list', 'Aucune séance', 'Créez une séance pour cette édition.')}</div>`;
}
const seForm = (ed) => (vals, errs) => { const f = FF(vals, errs); return `${f('ph', 'Phase', { type: 'select', opts: phasesOf(ed).map(p => [p.id, p.nom]) })}${f('lab', 'Nom de la séance', { req: 1, ph: 'Ex. : Tour 1' })}<div class="fg">${f('date', 'Date', { type: 'date', req: 1 })}${f('heure', 'Heure', { type: 'time' })}</div>${f('lieu', 'Lieu', { req: 1 })}`; };

function aSeance(id) {
  const s = D.seances.find(x => x.id === id); if (!s) return pNotFound();
  const ph = phaseOf(s), tab = S.f.sdtab || 'infos', val = s.st === 'valide' && !s.unlocked, st = sessionState(s);
  let body = '';
  if (tab === 'infos') body = `<div class="card"><div class="row"><h3 class="sp">Informations générales</h3>${val ? '' : `<button class="btn btn-g sm" data-act="se-edit" data-arg="${s.id}">${ic('edit', 15)}Modifier</button>`}</div><dl class="kv" style="margin-top:14px"><dt>Édition</dt><dd>${esc(edOf(s.ed).nom)}</dd><dt>Phase</dt><dd>${esc(ph.nom)} (${ph.q} qualifiés${ph.b ? ', ' + ph.b + ' au barrage' : ''} par groupe)</dd><dt>Date et heure</dt><dd>${dl(s.date)} ${hm(s.date)}</dd><dt>Lieu</dt><dd>${esc(s.lieu)}</dd><dt>Statut</dt><dd>${sBd(s)}</dd><dt>Score maximum</dt><dd class="num">${s.max}</dd><dt>Participants</dt><dd class="num">${s.parts.length}</dd></dl></div>`;
  if (tab === 'parts') {
    const free = partsOf(s.ed).filter(p => p.st !== 'elimine' && p.st !== 'en_attente' && !s.parts.includes(p.id) && !D.seances.some(x => x.ph === s.ph && x.id !== s.id && x.parts.includes(p.id)));
    body = `<div class="grid c2" style="align-items:start"><div class="card"><h3>Participants sélectionnés (${s.parts.length})</h3>${s.parts.length ? `<div class="tw" style="margin-top:12px;border:0"><table><tbody>${s.parts.map(i => { const p = pOf(i); return `<tr><td>${who(p, p.etab)}</td><td class="r">${val || s.st === 'valide' ? '' : `<button class="btn btn-r sm" data-act="sel-rm" data-arg="${i}" aria-label="Retirer">${ic('x', 14)}</button>`}</td></tr>`; }).join('')}</tbody></table></div>` : empty('users', 'Aucun participant', 'Sélectionnez des participants non éliminés.')}</div>
    <div class="card"><h3>Ajouter des participants</h3><p class="mute sm">Seuls les participants non éliminés de l'édition sont proposés. Sélection libre, effectif variable.</p>${s.st === 'valide' ? `<div class="warn" style="margin-top:12px">${ic('lock')}<span>Séance validée : la sélection est verrouillée.</span></div>` : free.length ? `<div class="sel-list" style="margin-top:12px">${free.map(p => `<label><input type="checkbox" data-selp="${p.id}" style="accent-color:var(--green);width:18px;height:18px">${av(p)}<span class="sp min0"><b class="sm">${esc(nm(p))}</b></span><span class="mute xs">n° ${p.num}</span></label>`).join('')}</div><button class="btn btn-p" style="margin-top:12px" data-act="sel-add">Ajouter la sélection</button>` : empty('users', 'Aucun participant disponible', '')}</div></div>`;
  }
  if (tab === 'jury') {
    const free = D.jury.filter(j => !s.jury.includes(j.id));
    body = `<div class="warn" style="margin-bottom:16px">${ic('info')}<span>Le jury est présent physiquement. Ses membres n'ont ni compte ni connexion : seuls leurs nom, fonction et établissement sont enregistrés pour cette séance.</span></div><div class="grid c2" style="align-items:start"><div class="card"><h3>Jury de la séance (${s.jury.length})</h3>${s.jury.length ? `<div class="tw" style="margin-top:12px;border:0"><table><tbody>${s.jury.map(i => { const j = D.jury.find(x => x.id === i); return `<tr><td><b>${esc(j.prenom + ' ' + j.nom)}</b><div class="mute xs">${esc(j.fonction)} · ${esc(j.etab)}</div></td><td class="r">${s.st === 'valide' ? '' : `<button class="btn btn-r sm" data-act="jury-rm" data-arg="${i}" aria-label="Retirer">${ic('x', 14)}</button>`}</td></tr>`; }).join('')}</tbody></table></div>` : empty('users', 'Aucun membre', 'Ajoutez les membres présents.')}</div>
    <div class="card stack" style="gap:12px"><h3>Ajouter un membre</h3>${s.st === 'valide' ? `<div class="warn">${ic('lock')}<span>Séance validée : le jury est conservé dans l'historique.</span></div>` : `<div class="fld"><label for="jury-pick">Depuis le répertoire</label><select class="inp" id="jury-pick" ${free.length ? '' : 'disabled'}>${free.length ? free.map(j => `<option value="${j.id}">${esc(j.prenom + ' ' + j.nom + ', ' + j.fonction)}</option>`).join('') : '<option>Tous les membres sont déjà ajoutés</option>'}</select></div><div class="row"><button class="btn btn-p sm" data-act="jury-add" ${free.length ? '' : 'disabled'}>Ajouter à la séance</button><button class="btn btn-o sm" data-act="jury-new">${ic('plus', 15)}Nouveau membre</button></div>`}</div></div>`;
  }
  if (tab === 'res') body = aResEntry(s, val, st, ph);
  if (tab === 'hist') body = `<div class="card"><h3>Historique</h3>${s.hist.length ? `<ul class="tline" style="margin-top:14px">${s.hist.map(h => `<li><b class="sm">${esc(h.txt)}</b><div class="mute xs">${ds(h.at)} ${hm(h.at)} · ${esc(h.who)}</div></li>`).join('')}</ul>` : empty('hist', 'Aucun événement', '')}</div>`;
  return `<div class="stack" style="gap:20px"><div class="crumb" style="margin:0"><a class="lnk" href="#admin-seances">Séances</a> / ${esc(s.lab)}</div>${head(esc(s.lab), `${esc(edOf(s.ed).nom)} · ${esc(ph.nom)}`, sBd(s))}${tabs('sdtab', [['infos', 'Informations générales'], ['parts', 'Participants'], ['jury', 'Jury'], ['res', 'Résultats'], ['hist', 'Historique']], 'infos')}${body}</div>`;
}

function aResEntry(s, val, st, ph) {
  if (!s.parts.length) return empty('users', 'Aucun participant', 'Sélectionnez d\'abord les participants de la séance.');
  const rows = st.rows, byId = Object.fromEntries(rows.map(r => [r.pid, r]));
  const tied = rows.filter(r => r.tie);
  const q = ph.q, bnd = ph.b;
  const preview = (r) => !r ? '<span class="mute xs">Score manquant</span>' : `<span class="mute xs">${val ? '' : 'Prévu : '}</span>${issueBd(r.issue)}`;
  const info = val ? `<div class="okbox" style="align-items:center">${ic('lock')}<span class="sp">Séance validée. Résultats verrouillés. Toute correction demande un motif et une autorisation spécifique, et est inscrite au journal.</span><button class="btn btn-g sm" data-act="res-correct">Corriger</button></div>`
    : `<div class="${st.ok ? 'okbox' : 'warn'}">${ic(st.ok ? 'check' : 'alert')}<div class="sp"><b>${st.ok ? 'Prête à valider' : 'Validation impossible pour le moment'}</b>${st.missing.length ? `<div class="sm">Scores manquants : ${st.missing.map(i => esc(nm(pOf(i)))).join(', ')}.</div>` : ''}${st.blocking ? `<div class="sm">Égalité sur une position décisive : saisissez le rang final obtenu après départage pour les candidats concernés.</div>` : ''}${st.ok ? `<div class="sm">${rows.filter(r => r.issue === 'qualifie' || r.issue === 'champion').length} qualifié(s), ${rows.filter(r => r.issue === 'barrage').length} au barrage, ${rows.filter(r => r.issue === 'elimine').length} éliminé(s) selon le classement par points.</div>` : ''}</div></div>`;
  return `<div class="stack" style="gap:16px">${info}<div class="card" style="padding:0"><div class="row" style="padding:16px 20px;border-bottom:1px solid var(--line)"><div class="sp"><h3>Saisie des scores</h3><p class="mute xs">Un score total par participant, sur ${s.max}. Le rang découle des points, l'issue découle du rang. Positions qualificatives : ${q} premiers${bnd ? `, puis ${bnd} au barrage` : ''}.</p></div>${val ? '' : `<button class="btn btn-p" data-act="res-validate" ${st.ok ? '' : 'disabled'}>${ic('check', 16)}Valider la séance</button>`}</div>
  <div class="tw" style="border:0;border-radius:0"><table><thead><tr><th>Participant</th><th class="r">Score / ${s.max}</th><th class="r">Rang</th><th>Issue</th><th>Départage</th><th>Commentaire interne</th></tr></thead><tbody>${s.parts.map(i => { const p = pOf(i), r = byId[i], dis = val ? 'disabled' : ''; const grp = r && r.same ? rows.filter(x => x.score === r.score).map(x => x.rank).sort((a, b) => a - b) : []; return `<tr><td>${who(p, 'n° ' + p.num)}</td><td class="r"><input class="inp sc" id="sc-${i}" data-score="${i}" type="number" min="0" max="${s.max}" step="1" value="${s.sc[i] ?? ''}" ${dis} aria-label="Score de ${esc(nm(p))}"></td><td class="r num"><b>${r ? r.rank : '-'}</b></td><td>${preview(r)}</td><td>${r && r.same ? `<select class="inp" style="height:36px;width:140px" data-ov="${i}" ${dis} aria-label="Rang final après départage"><option value="">Rang final</option>${grp.map(g => `<option value="${g}" ${(s.ov && +s.ov[i] === g) ? 'selected' : ''}>${g}</option>`).join('')}</select>` : '<span class="mute xs">-</span>'}</td><td><input class="inp" style="height:36px;min-width:150px" id="cm-${i}" data-com="${i}" value="${esc((s.com || {})[i] || '')}" ${dis} aria-label="Commentaire pour ${esc(nm(p))}"></td></tr>`; }).join('')}</tbody></table></div></div>
  ${rows.some(r => r.same) && !val ? `<p class="mute xs">${ic('info', 12)} Égalité de ${[...new Set(rows.filter(r => r.same).map(t => t.score))].join(' et ')} points : le départage se fait hors plateforme, seul le rang final est saisi.</p>` : ''}
  ${s.st === 'valide' ? `<div class="card"><h3>Classement officiel de la séance</h3><div style="margin-top:12px">${rankTable(s)}</div></div>` : ''}</div>`;
}

/* ---- Résultats et classements ---- */
function aResultats() {
  const ed = S.f['ar.ed'] || CED; const l = sessOf(ed);
  return `<div class="stack" style="gap:20px">${head('Résultats', `${toValidate().length} séance(s) en attente de validation.`)}<div class="tool">${sel('ar.ed', 'Édition', D.editions.filter(e => e.statut !== 'candidatures_ouvertes').map(e => [e.id, 'Édition ' + e.annee]))}</div>
  <div class="tw"><table><thead><tr><th>Séance</th><th>Date</th><th class="r">Scores saisis</th><th>État</th><th></th></tr></thead><tbody>${l.map(s => { const n = s.parts.filter(i => s.sc[i] != null && s.sc[i] !== '').length, stt = sessionState(s); return `<tr><td><b>${esc(s.lab)}</b></td><td>${ds(s.date)}</td><td class="r num">${n} / ${s.parts.length}</td><td>${s.st === 'valide' ? bd('Validée', 'ok') : s.st === 'planifie' ? bd('Planifiée', '') : stt.ok ? bd('Prête à valider', 'wait') : bd('Saisie incomplète', 'wait')}</td><td class="r"><a class="btn btn-g sm" href="#admin-seance-${s.id}" data-act="goto-res">Ouvrir</a></td></tr>`; }).join('')}</tbody></table></div></div>`;
}
function aClass() {
  const ed = S.f['ac2.ed'] || CED; const fr = finalRank(ed); const vs = sessOf(ed).filter(s => s.st === 'valide'); const sid = S.f['ac2.s'] || (vs[vs.length - 1] || {}).id; const s = vs.find(x => x.id === sid);
  return `<div class="stack" style="gap:20px">${head('Classements', 'Les rangs découlent des points enregistrés. Aucun classement n\'est saisi à la main, hormis le rang final après départage d\'une égalité.')}<div class="tool">${sel('ac2.ed', 'Édition', D.editions.filter(e => e.statut !== 'candidatures_ouvertes').map(e => [e.id, 'Édition ' + e.annee]))}${vs.length ? `<select class="inp" style="width:auto;min-width:260px" data-bind="ac2.s" aria-label="Séance">${vs.map(x => `<option value="${x.id}" ${x.id === sid ? 'selected' : ''}>${esc(x.lab)}</option>`).join('')}</select>` : ''}</div>
  <div class="card"><h3>Classement final officiel</h3>${fr ? `<div class="tw" style="margin-top:12px"><table><thead><tr><th>Rang</th><th>Participant</th><th class="r">Score</th><th>Titre</th></tr></thead><tbody>${fr.map(r => `<tr class="${r.rank === 1 ? 'hl' : ''}"><td class="num"><b>${r.rank}</b></td><td>${who(pOf(r.pid))}</td><td class="r num">${r.score}</td><td>${r.rank === 1 ? bd('DevAs', 'gold') : r.demi ? bd('Demi-finale') : bd('Finaliste', 'ok')}</td></tr>`).join('')}</tbody></table></div>` : `<div style="margin-top:8px">${empty('trophy', 'Classement final non établi', 'Il sera disponible à l\'issue de la grande finale. Le nombre de finalistes se règle dans les paramètres.')}</div>`}</div>
  ${s ? `<div class="card"><h3>${esc(s.lab)}</h3><div style="margin-top:12px">${rankTable(s)}</div></div>` : ''}</div>`;
}

/* ---- Annonces, archives, comptes, journal, paramètres ---- */
function aAnn() {
  const l = [...D.annonces].sort((a, b) => (b.date || '9').localeCompare(a.date || '9'));
  return `<div class="stack" style="gap:20px">${head('Annonces', 'Convocations, résultats, changements de calendrier et informations.', `<button class="btn btn-p" data-act="an-add">${ic('plus', 16)}Nouvelle annonce</button>`)}
  ${l.length ? `<div class="tw"><table><thead><tr><th>Annonce</th><th>Catégorie</th><th>Destinataires</th><th>Édition</th><th>Date</th><th>Statut</th><th></th></tr></thead><tbody>${l.map(a => `<tr><td><b>${esc(a.titre)}</b><div class="mute xs" style="max-width:360px">${esc(a.txt)}</div></td><td>${bd(a.cat)}</td><td>${a.cible === 'public' ? 'Public' : 'Participants'}</td><td>${a.ed}</td><td>${a.date ? ds(a.date) : '-'}</td><td>${bd(a.st === 'publiee' ? 'Publiée' : 'Brouillon', a.st === 'publiee' ? 'ok' : 'wait')}</td><td class="r"><div class="row" style="justify-content:flex-end;flex-wrap:nowrap"><button class="btn btn-g sm" data-act="an-pub" data-arg="${a.id}">${a.st === 'publiee' ? 'Dépublier' : 'Publier'}</button><button class="btn btn-r sm" data-act="an-del" data-arg="${a.id}" aria-label="Supprimer">${ic('trash', 15)}</button></div></td></tr>`).join('')}</tbody></table></div>` : empty('mega', 'Aucune annonce', 'Créez la première annonce.')}</div>`;
}

  'pt-acct'(el) { const p = pOf(el.dataset.arg); openConfirm(p.compte ? 'Désactiver le compte ?' : 'Activer le compte ?', `${esc(nm(p))} ${p.compte ? 'ne pourra plus se connecter à son espace.' : 'pourra consulter son espace participant (lecture seule).'}`, () => { p.compte = !p.compte; if (p.compte && p.st === 'en_attente' && edOf(p.ed).statut === 'en_cours') p.st = 'en_competition'; logAct(p.compte ? 'Activation d\'un compte' : 'Désactivation d\'un compte', nm(p)); toast(p.compte ? 'Compte activé' : 'Compte désactivé'); }, p.compte ? 'Désactiver' : 'Activer', p.compte); },
  /* phases */
  'ph-add'() { const ed = S.f['aph.ed'] || CED; mform('Créer une phase', phForm, { nom: '', type: 'tour', nbG: 1, q: 8, b: 0 }, v => { if (!need(['nom'])) return false; const o = Math.max(0, ...phasesOf(ed).map(p => p.ordre)) + 1; D.phases.push({ id: `${ed}-ph${Date.now() % 100000}`, ed, ordre: o, nom: v.nom, type: v.type, nbG: +v.nbG || 1, q: +v.q || 1, b: +v.b || 0, max: S.set.max }); logAct('Création d\'une phase', v.nom); toast('Phase créée'); }, 'Créer la phase'); },
  'ph-edit'(el) { const p = D.phases.find(x => x.id === el.dataset.arg); if (D.seances.some(s => s.ph === p.id && s.st === 'valide')) return toast('Phase verrouillée : une de ses séances est validée', 'err'); mform('Modifier la phase', phForm, { nom: p.nom, type: p.type, nbG: p.nbG, q: p.q, b: p.b }, v => { if (!need(['nom'])) return false; Object.assign(p, { nom: v.nom, type: v.type, nbG: +v.nbG || 1, q: +v.q || 1, b: +v.b || 0 }); logAct('Modification d\'une phase', p.nom); toast('Phase mise à jour'); }); },
  'ph-up'(el) { moveP(el.dataset.arg, -1); }, 'ph-down'(el) { moveP(el.dataset.arg, 1); },
  'ph-del'(el) { const p = D.phases.find(x => x.id === el.dataset.arg); openConfirm('Supprimer cette phase ?', `La phase <b>${esc(p.nom)}</b> n'est utilisée par aucune séance.`, () => { D.phases.splice(D.phases.indexOf(p), 1); phasesOf(p.ed).forEach((x, i) => x.ordre = i + 1); logAct('Suppression d\'une phase', p.nom); toast('Phase supprimée'); }, 'Supprimer', true); },
  /* séances */
  'se-add'() { const ed = S.f['as.ed'] || CED; if (S.route === 'admin-dashboard') S.f['as.ed'] = CED; const e = S.route === 'admin-dashboard' ? CED : ed; const ph = phasesOf(e); mform('Créer une séance', seForm(e), { ph: (ph.find(p => !D.seances.some(s => s.ph === p.id)) || ph[0]).id, lab: '', date: '', heure: '15:00', lieu: 'Amphi A, Highfive University' }, v => { if (!need(['lab', 'date', 'lieu'])) return false; const n = D.seances.filter(s => s.ed === e).length + 1; const s = { id: `${e}-s${n}${Date.now() % 100}`, ed: e, ph: v.ph, lab: v.lab, date: `${v.date} ${v.heure || '15:00'}`, lieu: v.lieu, st: 'planifie', parts: [], sc: {}, ov: {}, com: {}, jury: [], hist: [{ at: `${TODAY} ${hm(`${TODAY} 12:00`) ? '12:00' : ''}`, who: 'Admin Démo', txt: 'Séance créée' }], max: phaseOf({ ph: v.ph }).max }; D.seances.push(s); logAct('Création d\'une séance', s.lab); toast('Séance créée'); S.modal = null; go('admin-seance-' + s.id); return true; }, 'Créer la séance'); },
  'se-edit'(el) { const s = D.seances.find(x => x.id === el.dataset.arg); mform('Modifier la séance', seForm(s.ed), { ph: s.ph, lab: s.lab, date: s.date.slice(0, 10), heure: s.date.slice(11, 16), lieu: s.lieu }, v => { if (!need(['lab', 'date', 'lieu'])) return false; Object.assign(s, { ph: v.ph, lab: v.lab, date: `${v.date} ${v.heure || '15:00'}`, lieu: v.lieu }); s.hist.push({ at: `${TODAY} 12:00`, who: 'Admin Démo', txt: 'Informations modifiées' }); logAct('Modification d\'une séance', s.lab); toast('Séance mise à jour'); }); },
  'sel-add'() { const s = curSession(); const ids = [...document.querySelectorAll('[data-selp]:checked')].map(x => x.dataset.selp); if (!ids.length) return toast('Cochez au moins un participant', 'err'); ids.forEach(i => { if (!s.parts.includes(i)) s.parts.push(i); }); s.hist.push({ at: `${TODAY} 12:00`, who: 'Admin Démo', txt: `${plural(ids.length, 'participant ajouté', 'participants ajoutés')}` }); toast(`${plural(ids.length, 'participant ajouté', 'participants ajoutés')}`); render(); },
  'sel-rm'(el) { const s = curSession(); const i = el.dataset.arg; delete s.sc[i]; s.parts = s.parts.filter(x => x !== i); toast('Participant retiré de la séance'); render(); },
  'jury-add'() { const s = curSession(); const v = document.getElementById('jury-pick').value; if (!s.jury.includes(v)) s.jury.push(v); s.hist.push({ at: `${TODAY} 12:00`, who: 'Admin Démo', txt: 'Membre du jury ajouté' }); toast('Membre du jury ajouté'); render(); },
  'jury-rm'(el) { const s = curSession(); s.jury = s.jury.filter(x => x !== el.dataset.arg); toast('Membre retiré de la séance'); render(); },
  'jury-new'() { const s = curSession(); mform('Nouveau membre du jury', (vals, errs) => { const f = FF(vals, errs); return `<p class="mute sm">Le membre n'a pas de compte : ces informations sont conservées avec la séance.</p><div class="fg">${f('prenom', 'Prénom', { req: 1 })}${f('nom', 'Nom', { req: 1 })}</div>${f('fonction', 'Fonction', { req: 1 })}${f('etab', 'Établissement', { req: 1 })}`; }, { prenom: '', nom: '', fonction: '', etab: '' }, v => { if (!need(['prenom', 'nom', 'fonction', 'etab'])) return false; const j = { id: 'j' + (D.jury.length + 1), prenom: v.prenom, nom: v.nom, fonction: v.fonction, etab: v.etab }; D.jury.push(j); s.jury.push(j.id); s.hist.push({ at: `${TODAY} 12:00`, who: 'Admin Démo', txt: `Jury : ${j.prenom} ${j.nom} ajouté` }); toast('Membre ajouté à la séance'); }, 'Ajouter'); },
  'res-validate'() {
    const s = curSession(), st = sessionState(s); if (!st.ok) return;
    const out = st.rows.filter(r => r.issue === 'elimine').length;
    openConfirm('Valider officiellement cette séance ?', `Les résultats deviennent publics et verrouillés. Les issues découlent du classement par points : ${st.rows.filter(r => r.issue === 'qualifie' || r.issue === 'champion').length} qualifié(s), ${st.rows.filter(r => r.issue === 'barrage').length} au barrage, <b>${out} éliminé(s)</b> (définitivement pour cette édition).`, () => { applyValidation(s); s.unlocked = false; s.hist.push({ at: `${TODAY} 18:30`, who: 'Admin Démo', txt: 'Séance validée officiellement' }); logAct('Validation d\'une séance', s.lab); toast('Séance validée, résultats publiés'); }, 'Valider la séance');
  },
  'res-correct'() { const s = curSession(); mform('Corriger une séance validée', (vals, errs) => `<div class="warn">${ic('alert')}<span>Réservé aux administrateurs autorisés. La correction est inscrite au journal avec son motif.</span></div>${FF(vals, errs)('motif', 'Motif de la correction', { type: 'textarea', req: 1 })}`, { motif: '' }, v => { if (!need(['motif'], { motif: 'Le motif est obligatoire.' })) return false; s.unlocked = true; s.hist.push({ at: `${TODAY} 18:45`, who: 'Admin Démo', txt: `Correction autorisée : ${v.motif}` }); logAct('Modification autorisée d\'un résultat', `${s.lab} (${v.motif})`); toast('Séance déverrouillée pour correction'); }, 'Autoriser la correction'); },
  /* annonces */
  'an-add'() { mform('Nouvelle annonce', anForm, { titre: '', txt: '', cat: 'Information', ed: CED, cible: 'participants', st: 'publiee' }, v => { if (!need(['titre', 'txt'])) return false; D.annonces.unshift({ id: 'a' + Date.now() % 100000, ed: v.ed, titre: v.titre, cat: v.cat, cible: v.cible, date: v.st === 'publiee' ? TODAY : '', st: v.st, txt: v.txt }); logAct('Création d\'une annonce', v.titre); toast(v.st === 'publiee' ? 'Annonce publiée' : 'Brouillon enregistré'); }, 'Enregistrer'); },
  'an-pub'(el) { const a = D.annonces.find(x => x.id === el.dataset.arg); a.st = a.st === 'publiee' ? 'brouillon' : 'publiee'; if (a.st === 'publiee') a.date = TODAY; logAct(a.st === 'publiee' ? 'Publication d\'une annonce' : 'Dépublication d\'une annonce', a.titre); toast(a.st === 'publiee' ? 'Annonce publiée' : 'Annonce repassée en brouillon'); render(); },
  'an-del'(el) { const a = D.annonces.find(x => x.id === el.dataset.arg); openConfirm('Supprimer cette annonce ?', `« ${esc(a.titre)} » sera définitivement supprimée.`, () => { D.annonces.splice(D.annonces.indexOf(a), 1); logAct('Suppression d\'une annonce', a.titre); toast('Annonce supprimée'); }, 'Supprimer', true); },
  'ar-archive'(el) { const e = edOf(el.dataset.arg); openConfirm('Archiver cette édition ?', `${esc(e.nom)} passera en lecture seule.`, () => { e.statut = 'archivee'; logAct('Archivage d\'une édition', e.nom); toast('Édition archivée'); }, 'Archiver'); },
  /* comptes */
  'ac-add'() { mform('Créer un compte administrateur', (vals, errs) => { const f = FF(vals, errs); return `${f('nom', 'Nom complet', { req: 1 })}${f('email', 'E-mail', { type: 'email', req: 1 })}${f('role', 'Rôle', { type: 'select', opts: ['Administrateur', 'Super-administrateur'] })}`; }, { nom: '', email: '', role: 'Administrateur' }, v => { if (!need(['nom', 'email'])) return false; D.admins.push({ id: 'u' + (D.admins.length + 1), nom: v.nom, email: v.email, role: v.role, actif: true, perms: v.role.startsWith('Super') ? PERMS.slice() : ['séances'] }); logAct('Création d\'un compte administrateur', v.nom); toast('Compte créé'); }, 'Créer le compte'); },
  'ac-perms'(el) { const a = D.admins.find(x => x.id === el.dataset.arg); mform(`Permissions de ${a.nom}`, () => `<div class="stack" style="gap:12px">${PERMS.map(p => `<label class="chk"><input type="checkbox" data-perm="${p}" ${a.perms.includes(p) ? 'checked' : ''}> <span style="text-transform:capitalize">${p}</span></label>`).join('')}</div>`, {}, () => { a.perms = [...document.querySelectorAll('[data-perm]:checked')].map(x => x.dataset.perm); logAct('Modification des permissions', a.nom); toast('Permissions enregistrées'); }); },
  'ac-toggle'(el) { const a = D.admins.find(x => x.id === el.dataset.arg); a.actif = !a.actif; logAct(a.actif ? 'Activation d\'un compte administrateur' : 'Désactivation d\'un compte administrateur', a.nom); toast(a.actif ? 'Compte activé' : 'Compte désactivé'); render(); },
  'set-save'() { S.set.max = +document.getElementById('p-max').value; S.set.finalistes = Math.max(2, +document.getElementById('p-fin').value || 2); const f = phasesOf(CED).find(p => p.type === 'finale'); if (f) f.q = 1; logAct('Modification des paramètres', `Barème ${S.set.max}, ${S.set.finalistes} finalistes`); toast('Paramètres enregistrés'); render(); },
  'set-reset'() { openConfirm('Réinitialiser la démonstration ?', 'Toutes les modifications faites dans cette session seront perdues.', () => { resetData(); toast('Données de démonstration rétablies'); }, 'Réinitialiser', true); },
};
function moveP(id, d) { const p = D.phases.find(x => x.id === id), l = phasesOf(p.ed), i = l.indexOf(p), o = l[i + d]; if (!o) return; [p.ordre, o.ordre] = [o.ordre, p.ordre]; logAct('Réorganisation des phases', p.nom); render(); }

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = A[el.dataset.act]; if (!f) return;
  if (el.tagName === 'BUTTON' || el.dataset.act === 'modal-bg') { if (el.dataset.act !== 'modal-bg') e.preventDefault?.(); }
  f(el, e);
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.bind) { const k = t.dataset.bind, pre = k.split('.')[0]; S.f[k] = t.value; S.f[pre + '.p'] = 1; if (k.endsWith('.ed')) delete S.f[pre + '.s']; render(); return; }
  if (t.dataset.form) { S.form[t.dataset.form] = t.value; if (S.route === 'candidater') draftSave(); return; }
  if (t.dataset.file) { S.form[t.dataset.file] = t.files && t.files[0] ? t.files[0].name : ''; return; }
  if (S.modal && t.closest('#mform') && t.name) { S.modal.vals[t.name] = t.type === 'checkbox' ? t.checked : t.value; return; }
  const s = curSession(); if (!s) return;
  if (t.dataset.score) { const i = t.dataset.score; if (t.value === '') delete s.sc[i]; else s.sc[i] = Math.max(0, Math.min(s.max, Math.round(+t.value))); if (s.st === 'planifie') { s.st = 'en_cours'; s.hist.push({ at: `${TODAY} 14:00`, who: 'Admin Démo', txt: 'Séance ouverte, saisie des scores en direct' }); } render(); return; }
  if (t.dataset.ov) { s.ov = s.ov || {}; if (t.value) s.ov[t.dataset.ov] = +t.value; else delete s.ov[t.dataset.ov]; render(); return; }
  if (t.dataset.com) { s.com = s.com || {}; s.com[t.dataset.com] = t.value; }
});
document.addEventListener('submit', (e) => { e.preventDefault(); if (e.target.id === 'mform') A['modal-submit'](); if (e.target.id === 'lform') A['login-form'](); if (e.target.id === 'fform') A['forgot-send'](); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (S.modal) { S.modal = null; render(); } else if (S.nav || S.side) { S.nav = S.side = false; render(); } } });
window.addEventListener('hashchange', route);
route();


</script>
